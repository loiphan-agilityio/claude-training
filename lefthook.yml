commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: '*.{js,jsx,ts,tsx}'
      run: npx oxlint {staged_files}
    - name: prettier
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: npm run lint
    - name: format
      run: npm run format:check
    - name: test
      run: npm test -- --run
    - name: build
      run: npm run build
